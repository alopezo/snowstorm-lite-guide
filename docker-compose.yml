# Snowstorm Lite — see README.md for the full setup and how to load a terminology.
#
# Quick start:
#   1. cp snowstorm-lite.env.example snowstorm-lite.env   # then edit ADMIN_PASSWORD
#   2. docker compose up -d
#   3. open http://localhost:8080
#
# The init-permissions service fixes the volume ownership (the image runs as uid 1000 but a
# fresh volume is root-owned), so it works on the first start with no manual chown.
# Full explanation in README.md.

services:
  # Runs once as root, fixes the volume ownership, and exits.
  init-permissions:
    image: snomedinternational/snowstorm-lite:2.5.2
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /app/lucene-index"]
    volumes:
      - snowstorm-lite-volume:/app/lucene-index

  snowstorm-lite:
    image: snomedinternational/snowstorm-lite:2.5.2
    container_name: snowstorm-lite
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - snowstorm-lite.env
    volumes:
      - snowstorm-lite-volume:/app/lucene-index
    command:
      - "--index.path=lucene-index/data"
      # Persist syndication downloads inside the (writable) volume so they are kept and
      # reused across restarts. See README.md (Option A).
      - "--syndication.rf2-download-cache-directory=lucene-index/rf2-cache"
      # Persist the feed config (URL/credentials saved from Settings) inside the volume so it
      # survives restarts. Without this it's written to /app (root) and fails with
      # AccessDenied, so the configured feed is lost on restart.
      - "--syndication.feed-config-file=lucene-index/syndication-feed-config.properties"
    restart: unless-stopped

volumes:
  snowstorm-lite-volume:
